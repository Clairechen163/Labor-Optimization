name: Scheduled ETL and report

on:
  schedule:
    - cron: "17 1 * * 1"      # Mondays 01:17 UTC
  workflow_dispatch:

jobs:
  etl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Run ETL for each operation
        run: |
          for s in casino textile retail; do
            labor-opt etl --scenario $s --db data/warehouse_$s.db --out reports/etl/$s
          done
      - name: Rebuild report
        run: labor-opt report --out reports
      - uses: actions/upload-artifact@v4
        with:
          name: labor-warehouse-and-report
          path: |
            data/*.db
            reports/
          retention-days: 30
