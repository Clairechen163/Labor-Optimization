# Casino resort gaming pit: dealers, floor supervisors, cleaners.
# Demand and wages follow the original case study; the floor runs 24/7.
name: Casino gaming pit
industry: gaming
currency: HKD
seed: 7

days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
operating_days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]

# Demand is stated per time block: staff that must be on duty in every hour of the block.
blocks:
  night: [0, 6]
  morning: [6, 12]
  afternoon: [12, 18]
  evening: [18, 24]

roles:
  dealer:     {wage: 200, max_on_duty: 10}    # floor capacity: 8 tables x 1.25 relief ratio
  supervisor: {wage: 250}
  cleaner:    {wage: 150}

demand:
  dealer:     {morning: 4, afternoon: 5, evening: 6, night: 3}
  supervisor: {morning: 2, afternoon: 2, evening: 2, night: 1}
  cleaner:    {morning: 2, afternoon: 2, evening: 3, night: 2}

# Multiplier applied to demand on these days (Friday and Saturday nights are the peak).
peak_days: [Fri, Sat]
peak_multiplier: {dealer: 1.5, supervisor: 1.0, cleaner: 1.34}

# 8-hour shift templates the optimizer may use. Overlapping starts let it follow the demand curve.
shift_templates:
  - {name: early,  start: 6,  length: 8}
  - {name: mid,    start: 10, length: 8}
  - {name: swing,  start: 14, length: 8}
  - {name: late,   start: 18, length: 8, premium: 1.10}
  - {name: grave,  start: 22, length: 8, premium: 1.15}

# The traditional fixed three-shift pattern, used as the comparison baseline.
baseline_templates: [early, swing, grave]

workforce:
  dealer:
    - {count: 21, contract: FT}
    - {count: 6,  contract: PT}
  supervisor:
    - {count: 8, contract: FT}
    - {count: 2, contract: PT}
  cleaner:
    - {count: 10, contract: FT}
    - {count: 3,  contract: PT}

# Cross-training: share of each role also qualified for another role.
cross_training:
  - {from: supervisor, to: dealer, share: 0.5}

contracts:
  FT: {min_hours: 40, max_hours: 40, max_days: 5}    # guaranteed hours: an equality constraint
  PT: {min_hours: 0,  max_hours: 24, max_days: 3}

availability:
  share_no_nights: 0.2      # share of employees who cannot work shifts that run past midnight
  share_with_day_off_request: 0.3

rules:
  min_rest_hours: 11
  max_weekend_days: 2
  overtime_threshold: 40
  overtime_premium: 1.5
  max_overtime_hours: 0
  call_in_multiplier: 3.0   # uncovered hours are filled by call-in staff at 3x base wage
